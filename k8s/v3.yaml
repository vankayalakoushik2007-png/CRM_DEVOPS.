
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crm-v3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crm-v3
  template:
    metadata:
      labels:
        app: crm-v3
    spec:
      containers:
        - name: crm-v3
          image: YOUR-DOCKERHUB-USERNAME/crm-devops:v3
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: crm-v3-service
spec:
  type: NodePort
  selector:
    app: crm-v3
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30083
