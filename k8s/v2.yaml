
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crm-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crm-v2
  template:
    metadata:
      labels:
        app: crm-v2
    spec:
      containers:
        - name: crm-v2
          image: YOUR-DOCKERHUB-USERNAME/crm-devops:v2
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: crm-v2-service
spec:
  type: NodePort
  selector:
    app: crm-v2
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30082
