
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crm-v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crm-v1
  template:
    metadata:
      labels:
        app: crm-v1
    spec:
      containers:
        - name: crm-v1
          image: YOUR-DOCKERHUB-USERNAME/crm-devops:v1
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: crm-v1-service
spec:
  type: NodePort
  selector:
    app: crm-v1
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30081
